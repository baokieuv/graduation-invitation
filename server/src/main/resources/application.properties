spring.application.name=${BACKEND_APP_NAME:letter}
spring.port=${BACKEND_PORT:8080}

logging.file.name=${LOG_FILE:logs/letter.log}

# ----------------------------------------
# PostgreSQL Database Configuration
# ----------------------------------------
# Add ?timezone=Asia/Ho_Chi_Minh to the end of the URL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/graduation?timezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:graduation}
spring.datasource.password=${DB_PASSWORD:123456789}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# ----------------------------------------
# JPA / Hibernate Settings
# ----------------------------------------
# Automatically create or update your database tables based on your Java entities
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# Print SQL queries to the console/log file (helpful for debugging)
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# Explicitly tell Hibernate to use the PostgreSQL dialect
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

# ----------------------------------------
# Security Configuration
# ----------------------------------------
api.security.key=${API_SECURITY_KEY:my-super-secret-key}

# ----------------------------------------
# Cache Configuration
# ----------------------------------------
# Tell Spring to strictly use Caffeine
spring.cache.type=${CACHE_TYPE:caffeine}

# Configure the cache behavior
# expireAfterWrite=60m (clears items 60 minutes after they are saved)
# maximumSize=500 (stores a maximum of 500 items before evicting the oldest)
spring.cache.caffeine.spec=${CACHE_CAFFEINE_SPEC:maximumSize=500,expireAfterWrite=60m}