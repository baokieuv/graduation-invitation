spring.application.name=${BACKEND_APP_NAME:letter}
spring.port=${BACKEND_PORT:8080}

logging.file.name=${LOG_FILE:logs/letter.log}

# ----------------------------------------
# MariaDB Database Configuration
# ----------------------------------------
# Changed jdbc:postgresql to jdbc:mariadb and port to 3306
# Used serverTimezone for MariaDB instead of timezone
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/graduation?serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:graduation}
spring.datasource.password=${DB_PASSWORD:123456789}
spring.datasource.driver-class-name=${DB_DRIVER:org.mariadb.jdbc.Driver}

# ----------------------------------------
# JPA / Hibernate Settings
# ----------------------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Explicitly tell Hibernate to use the MariaDB dialect
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:org.hibernate.dialect.MariaDBDialect}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

# ----------------------------------------
# Security Configuration
# ----------------------------------------
api.security.key=${API_SECURITY_KEY:my-super-secret-key}

# ----------------------------------------
# Cache Configuration
# ----------------------------------------
spring.cache.type=${CACHE_TYPE:caffeine}
spring.cache.cache-names=config
spring.cache.caffeine.spec=${CACHE_CAFFEINE_SPEC:maximumSize=500,expireAfterWrite=60m}