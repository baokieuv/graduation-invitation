spring.application.name=letter

logging.file.name=logs/letter.log

# ----------------------------------------
# PostgreSQL Database Configuration
# ----------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase
spring.datasource.username=myuser
spring.datasource.password=mysecretpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# ----------------------------------------
# JPA / Hibernate Settings
# ----------------------------------------
# Automatically create or update your database tables based on your Java entities
spring.jpa.hibernate.ddl-auto=update

# Print SQL queries to the console/log file (helpful for debugging)
spring.jpa.show-sql=true

# Explicitly tell Hibernate to use the PostgreSQL dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------------------
# Security Configuration
# ----------------------------------------

api.security.key=my-super-secret-key